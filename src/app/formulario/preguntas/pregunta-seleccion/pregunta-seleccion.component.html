<div class="container mx-auto px-4 sm:px-6 lg:px-8">
  <div class="relative p-4">
    <!-- Input tipo texto y botón para desplegar el dropdown -->
    <input type="text" id="floating_outlined"
           class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-transparent rounded-lg border border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 peer"
           [(ngModel)]="seleccion"
           (input)="onInputChange($event)"
           placeholder="">

    <!-- Botón de ícono para mostrar el dropdown -->
    <button type="button" class="cursor-pointer absolute inset-y-10 right-8 transform -translate-y-1/2 flex items-center pr-3 text-gray-500" (click)="toggleDropdown()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06 0L10 10.939l3.71-3.73a.75.75 0 111.06 1.06l-4 4a.75.75 0 01-1.06 0l-4-4a.75.75 0 010-1.06z" clip-rule="evenodd" />
      </svg>
    </button>

    <!-- Dropdown visible solo al hacer clic en el ícono -->
    <div *ngIf="showDropdown" class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg pointer-events-auto" style="width: calc(100% - 2rem); left: 1rem;">
      <ul class="py-1">
        <li *ngFor="let opcion of opciones" class="cursor-pointer hover:bg-gray-200 px-4 py-2" (click)="seleccionarOpcion(opcion)">
          {{ opcion }}
        </li>
      </ul>
    </div>

    <!-- Label flotante -->
    <label for="floating_outlined"
           class="absolute text-sm bg-white left-6 text-gray-500 duration-300 transform -translate-y-7 scale-75 top-8 z-10 origin-[0] px-2 peer-focus:px-2 peer-focus:text-green-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-7 peer-placeholder-shown:top-1/2 peer-focus:top-3 peer-focus:scale-75 peer-focus:-translate-y-2 pointer-events-none transition-all">
      {{ label }}
    </label>

    <!-- Mensaje de error si es necesario -->
    <div class="mt-2 min-h-[24px] pointer-events-none">
      <div *ngIf="!seleccion">
        <p class="text-sm text-red-600 dark:text-red-500">
        </p>
      </div>
    </div>
  </div>
  <hr>
</div>
