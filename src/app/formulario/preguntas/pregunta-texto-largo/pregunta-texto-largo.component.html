<div class="container mx-auto px-4 sm:px-6 lg:px-8">
  <div class="relative p-4 pointer-events-none">
    <!-- Textarea para texto largo -->
    <textarea id="textarea_largo"
              class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-transparent rounded-lg border border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 peer pointer-events-auto"
              [(ngModel)]="respuesta"
              (ngModelChange)="onRespuestaChange($event)"
              [required]="required"
              [minlength]="minlength"
              #campoTextoLargo="ngModel"
              placeholder=" "
              rows="4"></textarea>

    <!-- Label flotante -->
    <label for="textarea_largo"
           class="left-5 absolute text-sm text-gray-500 duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-white px-2 pl-4 peer-focus:px-2 peer-focus:text-green-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-1 pointer-events-none">
      {{ label }}
    </label>

    <!-- Espacio reservado para mensajes de error -->
    <div class="mt-2 min-h-[24px] pointer-events-none">
      <!-- Mostrar mensajes de error -->
      <div *ngIf="campoTextoLargo.invalid && campoTextoLargo.touched">
        <div *ngIf="campoTextoLargo.errors?.['required']">
          <p class="text-sm text-red-600 dark:text-red-500"><span class="font-medium">Oops!</span> Este campo es obligatorio.</p>
        </div>
        <div *ngIf="campoTextoLargo.errors?.['minlength']">
          <p class="text-sm text-red-600 dark:text-red-500"><span class="font-medium">Oops!</span> Debe tener al menos {{ minlength }} caracteres.</p>
        </div>
      </div>
    </div>

    <hr>
  </div>
</div>
